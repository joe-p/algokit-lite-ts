name: Release package

on:
  workflow_call:
    inputs:
      package:
        description: Directory of the package under packages/
        required: true
        type: string
      tag-prefix:
        description: Prefix of the package's release tags
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ inputs.package }}
    steps:
      # Check out the branch tip rather than the pushed commit, so a queued run
      # releases everything that has landed on main since, including the
      # release commits of packages released earlier in this run.
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release
        id: semfrag
        uses: joe-p/semfrag/actions/prepare@e4ce6e37a786a2d283ce7edbaf235af5aa8d48b7 # v0.9.0
        with:
          changelog: packages/${{ inputs.package }}/CHANGELOG.md
          fragments-dir: packages/${{ inputs.package }}/changelog.d

      - name: Bump package.json version
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: npm pkg set "version=${VERSION}"

      - name: Commit, tag and create GitHub release
        if: steps.semfrag.outputs.released == 'true'
        uses: joe-p/semfrag/actions/publish@e4ce6e37a786a2d283ce7edbaf235af5aa8d48b7 # v0.9.0
        with:
          tag-prefix: ${{ inputs.tag-prefix }}

      # Workspace dependencies are built first so this package's declarations
      # can reference them. pnpm pack replaces workspace: dependency ranges
      # with the versions of the workspace packages.
      - name: Pack
        if: steps.semfrag.outputs.released == 'true'
        run: |
          pnpm --filter "$(npm pkg get name | tr -d '"')..." run build
          pnpm pack --out package.tgz

      - name: Publish to npm
        if: steps.semfrag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.semfrag.outputs.version }}
        run: |
          name="$(npm pkg get name | tr -d '"')"
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published."
          else
            npm publish package.tgz --access public
          fi

      - name: Roll back failed release
        if: failure() || cancelled()
        uses: joe-p/semfrag/actions/rollback@e4ce6e37a786a2d283ce7edbaf235af5aa8d48b7 # v0.9.0
