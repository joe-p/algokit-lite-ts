name: PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AlgoKit
        run: pipx install algokit==2.10.2

      - name: Start LocalNet
        run: algokit localnet start

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Check changelog
        uses: joe-p/semfrag/actions/check@8c3289a6cfe62de679532461fe8db80216fb5e28 # v0.8.0
        with:
          require-fragment-for: ^src/
